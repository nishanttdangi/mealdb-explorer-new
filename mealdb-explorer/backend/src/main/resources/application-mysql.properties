# ============================================================
#  MySQL Profile  –  activate with: --spring.profiles.active=mysql
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/mealdb_explorer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable H2 console for MySQL profile
spring.h2.console.enabled=false
