# ============================================================
#  TheMealDB Explorer – Application Configuration
# ============================================================

spring.application.name=mealdb-explorer
server.port=8080

# ── Database (MySQL) ─────────────────────────────────────────
# Switch to MySQL by setting DB_URL, DB_USER, DB_PASS env vars
# or editing the values below. Falls back to H2 if MySQL is absent.
spring.datasource.url=${DB_URL:jdbc:h2:mem:mealdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── H2 Console (dev only) ────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Cache (Caffeine) ─────────────────────────────────────────
spring.cache.type=caffeine
# TTL 30 min, max 500 entries per cache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1800s

# ── TheMealDB API ────────────────────────────────────────────
mealdb.api.base-url=https://www.themealdb.com/api/json/v1/1
mealdb.api.timeout-seconds=10

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# ── Swagger / OpenAPI ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
